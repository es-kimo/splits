[sweep]
config = "baseline"
ledger_root = "out/ledger_sweep_policies"
registry_root = "out/rating_runs"
holdout_seasons = 2
bootstrap_resamples = 1000
bootstrap_seed = 20260907
head2head_prob = 0.65

[defaults]
tau = 1.0
sigma0 = 8.333
beta_ratio = 0.5
rating_period = "meet"
policy = "conservative"
final_round_weight = 1.0

[axes]
tau = [0.25, 0.5, 1.0, 2.0]
sigma0 = [5.0, 8.333, 12.0]
beta_ratio = [0.3333333333333333, 0.5, 1.0]
rating_period = ["meet", "month"]
policy = ["conservative", "aggressive"]
final_round_weight = [1.0, 1.5]
