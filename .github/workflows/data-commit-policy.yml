name: data-commit-policy

on:
  pull_request:
  push:

jobs:
  validate-data-commit-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate anonymous data commit policy
        run: python3 scripts/check_data_commit_policy.py --mode tracked
