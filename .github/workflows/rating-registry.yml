name: rating-registry

on:
  pull_request:

jobs:
  test-and-version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest tests/test_registry.py tests/test_replay_determinism.py tests/test_rating_runner.py -v
      - run: python3 scripts/check_rating_algorithm_version.py --base "origin/${{ github.base_ref }}"
